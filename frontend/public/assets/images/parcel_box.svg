<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow -->
    <filter id="parcelShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- Kraft Gradient -->
    <linearGradient id="kraftFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99B52"/>
      <stop offset="100%" stop-color="#B8762D"/>
    </linearGradient>
    <linearGradient id="kraftSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5752C"/>
      <stop offset="100%" stop-color="#8F5419"/>
    </linearGradient>
    <linearGradient id="kraftTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB374"/>
      <stop offset="100%" stop-color="#C9883E"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <g filter="url(#parcelShadow)">
    <!-- 3D Isometric Parcel Box -->
    <!-- Top Flap -->
    <polygon points="60,20 96,36 60,52 24,36" fill="url(#kraftTop)" stroke="#8F5419" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <polygon points="24,36 60,52 60,94 24,78" fill="url(#kraftFront)" stroke="#8F5419" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <polygon points="60,52 96,36 96,78 60,94" fill="url(#kraftSide)" stroke="#744110" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Yellow / Gold Sealing Tape / Ribbon -->
    <polygon points="56,22 64,25 64,50 56,47" fill="url(#goldRibbon)"/>
    <polygon points="56,47 64,50 64,94 56,92" fill="url(#goldRibbon)"/>
    
    <!-- OfficeBite Chef Hat Emblem on Front -->
    <g transform="translate(37, 56) scale(0.24)">
      <path d="M25 15 C20 8, 12 10, 10 18 C5 18, 2 24, 5 30 C2 35, 6 42, 14 42 L36 42 C44 42, 48 35, 45 30 C48 24, 45 18, 40 18 C38 10, 30 8, 25 15 Z" fill="#121212" opacity="0.8"/>
      <rect x="12" y="44" width="26" height="5" rx="2" fill="#121212" opacity="0.8"/>
    </g>

    <!-- Handle on top -->
    <path d="M50 25 C50 14 70 14 70 25" stroke="#744110" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M52 25 C52 16 68 16 68 25" stroke="#D99B52" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Hot Steam Vapors Rising -->
  <path d="M52 14 Q48 8 52 2" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M60 12 Q64 6 60 0" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M68 15 Q64 9 68 3" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>

