<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Succulent Roasted Meat Gradient -->
    <linearGradient id="roastGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="25%" stop-color="#EA580C" />
      <stop offset="65%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <!-- Crisp Golden Skin Highlight -->
    <linearGradient id="skinGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>
    <!-- Bone Gradient -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F5F5F4" />
      <stop offset="100%" stop-color="#D6D3D1" />
    </linearGradient>
    <!-- Deep Drop Shadow -->
    <filter id="chickenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#451A03" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#chickenShadow)" transform="rotate(-15 50 50)">
    <!-- Bone Knuckle Bottom -->
    <!-- Lower Shaft -->
    <rect x="44" y="66" width="12" height="15" rx="3" fill="url(#boneGrad)" stroke="#A8A29E" stroke-width="1.2" />
    <!-- Two Knuckle Knobs -->
    <circle cx="43" cy="81" r="5.5" fill="url(#boneGrad)" stroke="#A8A29E" stroke-width="1.2" />
    <circle cx="56" cy="81" r="5.5" fill="url(#boneGrad)" stroke="#A8A29E" stroke-width="1.2" />

    <!-- Main Juicy Roasted Chicken Drumstick Body -->
    <path
      d="M 50,14 C 68,14 84,28 82,46 C 80,60 64,68 56,70 C 44,70 32,60 26,46 C 22,28 34,14 50,14 Z"
      fill="url(#roastGrad)"
      stroke="#7C2D12"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Savory Roasted Skin Crisp Highlight (Top-Left Glaze) -->
    <path
      d="M 48,18 C 62,18 74,26 72,40 C 70,50 60,56 52,56 C 42,56 34,48 32,38 C 30,26 38,18 48,18 Z"
      fill="url(#skinGleam)"
    />

    <!-- Char / Grill Marks on Roasted Surface -->
    <path d="M 40,28 Q 50,26 58,30" stroke="#78350F" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 36,38 Q 48,36 62,40" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65" />
    <path d="M 42,48 Q 50,46 58,49" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Subtle Herb Garnish Flakes -->
    <circle cx="44" cy="33" r="1.3" fill="#15803D" opacity="0.9" />
    <circle cx="55" cy="42" r="1.1" fill="#15803D" opacity="0.85" />
    <circle cx="48" cy="23" r="1" fill="#15803D" opacity="0.8" />
  </g>
</svg>

