<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Leaf Gradient 1 (Dark to Fresh Green) -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <!-- Leaf Gradient 2 (Deep Forest to Vibrant Green) -->
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="40%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="leafGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#14532D" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#leafGlow)">
    <!-- Central Curry Leaf Stem curving gracefully from bottom-left to top-right -->
    <path d="M 18,84 Q 38,62 58,40 Q 72,24 82,14" stroke="url(#stemGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- Terminal Tip Leaf (Top Right) -->
    <path d="M 80,16 C 76,8 84,4 88,6 C 92,10 88,18 80,16 Z" fill="url(#leafGrad1)" />
    <path d="M 81,15 Q 85,10 87,7" stroke="#BBF7D0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Pair 1: Top-Left Leaflet -->
    <path d="M 68,26 C 60,18 54,20 54,26 C 54,32 64,32 70,28 Z" fill="url(#leafGrad2)" />
    <path d="M 69,27 Q 60,24 55,24" stroke="#86EFAC" stroke-width="0.9" fill="none" opacity="0.75" />

    <!-- Pair 1: Top-Right Leaflet -->
    <path d="M 72,24 C 80,16 86,18 86,24 C 86,30 76,30 70,26 Z" fill="url(#leafGrad1)" />
    <path d="M 71,25 Q 80,22 84,22" stroke="#BBF7D0" stroke-width="0.9" fill="none" opacity="0.75" />

    <!-- Pair 2: Mid-Upper Left Leaflet -->
    <path d="M 56,38 C 44,28 36,30 36,38 C 36,46 48,46 58,40 Z" fill="url(#leafGrad1)" />
    <path d="M 57,39 Q 44,36 38,36" stroke="#BBF7D0" stroke-width="1.1" fill="none" opacity="0.8" />

    <!-- Pair 2: Mid-Upper Right Leaflet -->
    <path d="M 60,36 C 72,26 80,28 80,36 C 80,44 68,44 58,38 Z" fill="url(#leafGrad2)" />
    <path d="M 59,37 Q 72,34 78,34" stroke="#86EFAC" stroke-width="1.1" fill="none" opacity="0.8" />

    <!-- Pair 3: Mid-Lower Left Leaflet -->
    <path d="M 44,52 C 30,40 20,44 20,54 C 20,64 34,62 46,54 Z" fill="url(#leafGrad2)" />
    <path d="M 45,53 Q 30,50 22,51" stroke="#86EFAC" stroke-width="1.2" fill="none" opacity="0.85" />

    <!-- Pair 3: Mid-Lower Right Leaflet -->
    <path d="M 48,50 C 62,38 72,42 72,52 C 72,62 58,60 46,52 Z" fill="url(#leafGrad1)" />
    <path d="M 47,51 Q 62,48 70,49" stroke="#BBF7D0" stroke-width="1.2" fill="none" opacity="0.85" />

    <!-- Pair 4: Lower Left Leaflet -->
    <path d="M 32,66 C 18,54 8,60 8,70 C 8,80 22,78 34,68 Z" fill="url(#leafGrad1)" />
    <path d="M 33,67 Q 18,66 10,67" stroke="#BBF7D0" stroke-width="1.3" fill="none" opacity="0.9" />

    <!-- Pair 4: Lower Right Leaflet -->
    <path d="M 36,64 C 50,52 60,58 60,68 C 60,78 46,76 34,66 Z" fill="url(#leafGrad2)" />
    <path d="M 35,65 Q 50,64 58,65" stroke="#86EFAC" stroke-width="1.3" fill="none" opacity="0.9" />
  </g>
</svg>

